<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OGM · Avaliação de Serviços Públicos</title>
<style>
  :root{
    --azul:#0056EF; --azul2:#0a3aa8; --azul-esc:#0a2350;
    --verde:#20BF40; --amarelo:#EDA704; --laranja:#F26522; --vermelho:#E23B2E;
    --bg:#eef1f8; --card:#ffffff; --linha:#e2e7f3; --texto:#1b2334; --muted:#6b7690;
    --grad:linear-gradient(90deg,var(--verde),var(--amarelo),var(--laranja));
    --sombra:0 1px 3px rgba(20,35,80,.08),0 1px 2px rgba(20,35,80,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--texto);font-size:14px;line-height:1.45}
  a{color:var(--azul)}
  header{background:#fff;border-bottom:1px solid var(--linha);box-shadow:var(--sombra)}
  .headbar{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px}
  .logo{width:46px;height:46px;min-width:46px;flex:0 0 auto}
  .htxt h1{font-size:18px;margin:0;letter-spacing:.2px}
  .htxt .sub{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1.5px}
  .voltar{margin-left:auto;font-size:13px;font-weight:700;color:var(--azul);text-decoration:none;
    border:1px solid #cfdcff;border-radius:9px;padding:8px 14px;background:#fff}
  .voltar:hover{background:#f2f6ff}
  .gradbar{height:4px;background:var(--grad)}
  nav{background:var(--azul-esc)}
  .navwrap{max-width:1240px;margin:0 auto;display:flex;gap:2px;padding:0 12px;flex-wrap:wrap}
  nav button{background:transparent;border:0;color:#c9d6f5;font-size:13.5px;font-weight:600;
    padding:12px 16px;cursor:pointer;border-bottom:3px solid transparent}
  nav button:hover{color:#fff}
  nav button.on{color:#fff;border-bottom-color:var(--amarelo)}
  main{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
  .card{background:var(--card);border:1px solid var(--linha);border-radius:12px;box-shadow:var(--sombra)}
  .pad{padding:18px}
  h2.sec{font-size:16px;margin:0 0 2px}
  .lead{color:var(--muted);font-size:13px;margin:0 0 16px}
  .btn{border:0;border-radius:9px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--azul);color:#fff}
  .btn.primary:hover{background:var(--azul2)}
  .btn.ghost{background:#fff;color:var(--azul);border:1px solid #cfdcff}
  .btn.ghost:hover{background:#f2f6ff}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
  .btn.danger{background:#fff;color:var(--vermelho);border:1px solid #f3c9c5}
  .btn.ok{background:var(--verde);color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
  .kpi{padding:16px 18px;position:relative;overflow:hidden}
  .kpi .n{font-size:30px;font-weight:800;line-height:1}
  .kpi .l{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px}
  .kpi .sub2{font-size:11px;color:var(--muted);margin-top:3px}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--azul)}
  .kpi.g::before{background:var(--verde)} .kpi.y::before{background:var(--amarelo)}
  .kpi.o::before{background:var(--laranja)} .kpi.r::before{background:var(--vermelho)}
  .kpi.b::before{background:#7A5CF0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .toolbar .fld{display:flex;flex-direction:column;gap:4px}
  .toolbar .fld span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .toolbar input,.toolbar select{padding:9px 11px;border:1px solid var(--linha);border-radius:8px;font-size:13px;background:#fff;font-family:inherit}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--linha);vertical-align:top}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:#f7f9fe;position:sticky;top:0;z-index:2}
  tbody tr:hover{background:#f7f9ff;cursor:pointer}
  tbody tr.alerta{background:#fff5f4}
  tbody tr.alerta:hover{background:#ffe9e6}
  tbody tr.alerta td:first-child{border-left:4px solid var(--vermelho)}
  .tblwrap{overflow:auto;max-height:65vh;border-radius:10px;border:1px solid var(--linha)}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .chip.blue{background:#e5edff;color:#1a49c7}
  .chip.green{background:#e2f7e6;color:#1a8f33}
  .chip.amber{background:#fdf1d6;color:#9a6a00}
  .chip.orange{background:#ffe9dc;color:#c34e15}
  .chip.red{background:#fde3e0;color:#c02a1f}
  .chip.gray{background:#eceff5;color:#5a6480}
  .chip.purple{background:#efe9ff;color:#5b3fd0}
  .overlay{position:fixed;inset:0;background:rgba(15,25,55,.5);display:flex;align-items:flex-start;
    justify-content:center;padding:26px 14px;overflow:auto;z-index:50}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:960px;box-shadow:0 24px 60px rgba(10,25,70,.35)}
  .modal.wide{max-width:1180px}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--linha)}
  .modal-head h3{margin:0;font-size:16px}
  .modal-head .x{border:0;background:#f1f4fb;border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer;color:#5a6480}
  .modal-body{padding:20px 22px;max-height:74vh;overflow:auto}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--linha);background:#fafbfe;border-radius:0 0 14px 14px;flex-wrap:wrap}
  fieldset{border:1px solid var(--linha);border-radius:10px;padding:14px 16px 4px;margin:0 0 18px}
  legend{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--azul);padding:0 8px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
  .frow.one{grid-template-columns:1fr}
  .frow.three{grid-template-columns:1fr 1fr 1fr}
  .frow.four{grid-template-columns:1fr 1fr 1fr 1fr}
  @media(max-width:680px){.frow,.frow.three,.frow.four{grid-template-columns:1fr}}
  label.f{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:#374260}
  label.f .hint{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid #d5ddee;border-radius:8px;font-size:13.5px;
    font-family:inherit;background:#fff;color:var(--texto)}
  input:focus,select:focus,textarea:focus{outline:2px solid #bcd0ff;border-color:var(--azul)}
  textarea{min-height:70px;resize:vertical}
  .check{display:flex;gap:9px;align-items:flex-start;font-size:13px;font-weight:600;color:#374260;margin-bottom:8px}
  .check input{width:auto;margin-top:2px;flex:0 0 auto}
  .check .hint{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
  .empty{text-align:center;color:var(--muted);padding:48px 20px}
  .empty svg{opacity:.35;margin-bottom:10px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--azul-esc);color:#fff;
    padding:12px 20px;border-radius:10px;font-weight:600;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .setup{max-width:760px;margin:40px auto}
  .setup ol{line-height:1.8} .setup code{background:#eef1f8;padding:2px 6px;border-radius:5px;font-size:12.5px}

  /* ---------- ícones-âncora dos eixos ---------- */
  .eixo-ico{width:30px;height:30px;flex:0 0 auto}
  .eixo-ico.lg{width:54px;height:54px}
  .eixo-tag{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;
    letter-spacing:.4px;padding:4px 11px 4px 5px;border-radius:20px;background:#eef2fb;color:#374260}
  .eixo-tag svg{width:20px;height:20px}

  /* ---------- modo entrevista ---------- */
  .ent-wrap{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .ent-top{background:#fff;border-bottom:1px solid var(--linha);padding:12px 20px;display:flex;
    align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--sombra)}
  .ent-top .id{font-family:ui-monospace,Consolas,monospace;font-weight:800;color:var(--azul2);
    background:#e5edff;padding:6px 12px;border-radius:8px;font-size:14px}
  .ent-prog{flex:1;min-width:140px;height:8px;background:#e8eefc;border-radius:6px;overflow:hidden}
  .ent-prog i{display:block;height:100%;background:var(--grad);width:0;transition:width .25s}
  .ent-body{flex:1;overflow:auto;padding:26px 20px 40px}
  .ent-inner{max-width:900px;margin:0 auto}
  .ent-bloco{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  .ent-bloco h3{margin:0;font-size:15px;color:var(--muted);font-weight:700}
  .ent-perg{font-size:26px;font-weight:700;line-height:1.3;margin:6px 0 4px;letter-spacing:-.2px}
  @media(max-width:700px){.ent-perg{font-size:21px}}
  .ent-orient{background:#f5f8ff;border:1px solid #dbe6ff;border-radius:9px;padding:10px 13px;
    font-size:13px;color:#3a4870;margin:12px 0 0}
  .ent-opts{display:grid;gap:16px;margin:26px 0 0;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .opt{background:#fff;border:3px solid var(--linha);border-radius:18px;padding:22px 16px 18px;
    cursor:pointer;text-align:center;font-family:inherit;transition:border-color .12s,transform .12s;
    display:flex;flex-direction:column;align-items:center;gap:12px;min-height:150px;justify-content:center}
  .opt:hover{border-color:#b9ccff}
  .opt:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
  .opt.on{border-color:var(--azul);background:#f2f6ff;transform:translateY(-3px)}
  .opt .rot{font-size:20px;font-weight:700}
  .opt svg{width:104px;height:104px}
  .opt.barra svg{width:118px;height:68px}
  .opt.txt{min-height:0;padding:20px 16px}
  .opt.txt .rot{font-size:18px}
  .ent-esp{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;justify-content:center}
  .esp{background:#fff;border:2px solid var(--linha);border-radius:12px;padding:10px 16px;
    font-size:13px;font-weight:700;color:#5a6480;cursor:pointer;font-family:inherit}
  .esp:hover{border-color:#b9ccff}
  .esp.on{border-color:var(--azul);background:#f2f6ff;color:var(--azul2)}
  .esp.alerta.on{border-color:var(--vermelho);background:#fde3e0;color:#b02a1f}
  .ent-aberta textarea{min-height:170px;font-size:17px;line-height:1.5;margin-top:20px;padding:16px}
  .ent-foot{background:#fff;border-top:1px solid var(--linha);padding:14px 20px;display:flex;
    gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .ent-foot .btn{padding:14px 26px;font-size:15px;border-radius:11px}
  .ent-passo{font-size:12.5px;color:var(--muted);font-weight:700}

  /* ---------- gestão ---------- */
  .lista-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--linha);
    border-radius:11px;margin-bottom:10px;background:#fff;flex-wrap:wrap}
  .lista-item .mt{flex:1;min-width:220px}
  .lista-item .mt b{display:block;font-size:14.5px}
  .lista-item .mt .m2{font-size:12px;color:var(--muted);margin-top:3px}
  .lista-item .acts{display:flex;gap:7px;flex-wrap:wrap}
  .form-card{cursor:pointer;transition:border-color .12s}
  .form-card:hover{border-color:#b9ccff}
  .sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .sub-tabs button{border:1px solid var(--linha);background:#fff;border-radius:20px;padding:7px 14px;
    font-size:12.5px;font-weight:600;cursor:pointer;color:#374260;font-family:inherit}
  .sub-tabs button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
  .linha-edit{display:grid;gap:8px;align-items:start;padding:10px;border:1px solid var(--linha);
    border-radius:9px;margin-bottom:8px;background:#fbfcff}
  .rm{background:#fff;color:var(--vermelho);border:1px solid #f3c9c5;border-radius:7px;
    width:32px;height:32px;cursor:pointer;font-size:15px;flex:0 0 auto;font-family:inherit}
  .opcoes-box{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .opcoes-box .oc{background:#eef2fb;border-radius:16px;padding:4px 10px;font-size:11.5px;font-weight:700;color:#374260}
  .fila-badge{position:fixed;right:18px;bottom:18px;background:var(--laranja);color:#fff;border:0;
    border-radius:11px;padding:11px 16px;font-weight:700;font-size:13px;cursor:pointer;z-index:70;
    box-shadow:0 8px 22px rgba(0,0,0,.22);display:none;font-family:inherit}
  .fila-badge.show{display:block}
  .barrinha{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .barrinha .lbl{width:40%;min-width:110px}
  .barrinha .track{flex:1;height:10px;background:#eef1f8;border-radius:6px;overflow:hidden}
  .barrinha .fill{height:100%;border-radius:6px;background:var(--azul)}
  .barrinha .val{width:42px;text-align:right;font-weight:800;color:var(--muted)}
  .aviso{border-radius:9px;padding:11px 14px;font-size:12.5px;font-weight:600;margin-bottom:14px}
  .aviso.r{background:#fde3e0;color:#b02a1f;border:1px solid #f3c9c5}
  .aviso.y{background:#fdf1d6;color:#8a5d00;border:1px solid #f0dcae}
  .aviso.b{background:#eaf1ff;color:#1a3f96;border:1px solid #cfdcff}
  .hidden{display:none!important}
  .det-bloco{border:1px solid var(--linha);border-radius:10px;padding:14px;margin-bottom:12px}
  .det-bloco h4{margin:0 0 10px;font-size:13.5px;display:flex;align-items:center;gap:9px}
  .det-q{padding:8px 0;border-bottom:1px dashed var(--linha);font-size:13px}
  .det-q:last-child{border-bottom:0}
  .det-q .e{color:#374260}
  .det-q .r{font-weight:700;margin-top:3px}
  .det-q .r.neg{color:var(--vermelho)} .det-q .r.med{color:#9a6a00} .det-q .r.pos{color:#1a8f33}
  .det-q .r.esp{color:var(--muted)}
  .det-q blockquote{margin:5px 0 0;padding:8px 12px;background:#f7f9ff;border-left:3px solid var(--azul);
    border-radius:0 7px 7px 0;font-size:13px;color:#374260;white-space:pre-wrap}
  @media print{
    body{background:#fff}
    header,nav,.toolbar,.no-print,.fila-badge,.toast{display:none!important}
    main{max-width:none;padding:0}
    .card{border:0;box-shadow:none}
    .tblwrap{max-height:none;overflow:visible;border:0}
    .print-only{display:block!important}
  }
  .print-only{display:none}
  .capa{text-align:center;padding:36px 20px 26px;border-bottom:3px solid var(--azul)}
  .capa h1{font-size:23px;margin:14px 0 6px}
  .capa .org{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .capa .filtros{margin-top:16px;font-size:13px;color:#374260;line-height:1.9}
  .capa .filtros b{color:var(--azul2)}
</style>
</head>

function ir(v){

/* ================================================================
   CARGA DE DADOS
================================================================ */
async function carregarFormularios(){
  const {data,error}=await sb.from("av_formularios").select("*").order("created_at",{ascending:false});
  if(error){toast("Erro ao carregar formulários: "+error.message);return;}
  FORMS=data||[];
}
async function carregarAuxOGM(){
  try{
    const {data,error}=await sbo.rpc('aux_todas');
    if(!error&&data){AUX=data;return;}
  }catch(e){}
  const map={taxonomia:"aux_taxonomia",ods:"aux_ods",ods_metas:"aux_ods_metas",
    servidores:"aux_servidores",orgaos:"aux_orgaos",unidades:"aux_unidades",
    eixos:"aux_eixos",predios:"aux_predios"};
  const ks=Object.keys(map);
  const rs=await Promise.all(ks.map(k=>sbo.from(map[k]).select("*").then(r=>r).catch(()=>({data:null}))));
  ks.forEach((k,i)=>AUX[k]=(rs[i]&&rs[i].data)||[]);
}
async function carregarEntrevistas(){
  let q=sb.from("av_entrevistas").select("*").order("created_at",{ascending:false}).limit(5000);
  const {data,error}=await q;
  if(error){toast("Erro ao carregar entrevistas: "+error.message);return [];}
  ENTS=data||[];return ENTS;
}
async function carregarEncaminhamentos(){
  const {data,error}=await sb.from("av_encaminhamentos").select("*").order("created_at",{ascending:false});
  if(error){toast("Erro: "+error.message);return [];}
  ENCS=data||[];return ENCS;
}
async function carregarFormCompleto(id){
  const {data,error}=await sb.rpc('av_formulario_completo',{p_id:id});
  if(error||!data){toast("Erro ao abrir formulário: "+(error?error.message:"vazio"));return null;}
  return data;
}
async function proximoCodigo(pref){
  const {data,error}=await sb.rpc('av_proximo_codigo',{p_prefixo:pref});
  if(error){ // fallback offline
    const ano=new Date().getFullYear();
    const n=Math.floor(Math.random()*9000)+1000;
    return `${pref}-${ano}-L${n}`;
  }
  return data;
}

/* ================================================================
   FILA OFFLINE
================================================================ */
const FILA_KEY="av_fila_v1";
function lerFila(){try{return JSON.parse(localStorage.getItem(FILA_KEY)||"[]")}catch(e){return []}}
function gravarFila(f){try{localStorage.setItem(FILA_KEY,JSON.stringify(f))}catch(e){}}
function enfileirar(pacote){const f=lerFila();f.push(pacote);gravarFila(f);atualizarFila();}
function atualizarFila(){
  const n=lerFila().length, b=$("#fila");
  b.classList.toggle("show",n>0);
  b.textContent=n===1?"1 entrevista aguardando envio — tocar para enviar"
                     :`${n} entrevistas aguardando envio — tocar para enviar`;
}
async function sincronizarFila(silencioso){
  const f=lerFila();
  if(!f.length){if(!silencioso)toast("Nada pendente para enviar.");return;}
  if(!navigator.onLine){if(!silencioso)toast("Sem conexão. As entrevistas continuam guardadas no aparelho.");return;}
  let ok=0;const resta=[];
  for(const p of f){
    const r=await gravarEntrevista(p.entrevista,p.respostas,true);
    if(r)ok++;else resta.push(p);
  }
  gravarFila(resta);atualizarFila();
  if(ok)toast(`${ok} entrevista(s) enviada(s).`);
  else if(!silencioso)toast("Não foi possível enviar agora. Os dados continuam guardados.");
  if(ok && (view==="respostas"||view==="painel"))ir(view);
}

async function gravarEntrevista(cab,resps,daFila){
  try{
    const {data,error}=await sb.from("av_entrevistas").insert(cab).select("id").single();
    if(error)throw error;
    const linhas=resps.map(r=>({...r,entrevista_id:data.id}));
    if(linhas.length){
      const {error:e2}=await sb.from("av_respostas").insert(linhas);
      if(e2)throw e2;
    }
    return true;
  }catch(e){
    if(!daFila){enfileirar({entrevista:cab,respostas:resps});}
    return false;
  }
}

================================================================ */
function barraFiltros(extra){
  const fs=FORMS.filter(f=>f.status!=="descartado");
  const fSel=FORMS.find(f=>String(f.id)===String(FILTRO.form));
  return `<div class="toolbar no-print">
    <div class="fld"><span>Formulário</span>
      <select id="f_form"><option value="">Todos</option>
      ${fs.map(f=>`<option value="${f.id}" ${String(f.id)===String(FILTRO.form)?'selected':''}>${esc(f.nome)} · v${f.versao}</option>`).join("")}
      </select></div>
    <div class="fld"><span>Unidade</span>
      <select id="f_unid"><option value="">Todas</option>
      ${(window.__UNIDS||[]).map(u=>`<option value="${esc(u)}" ${u===FILTRO.unidade?'selected':''}>${esc(u)}</option>`).join("")}
      </select></div>
    <div class="fld"><span>Faixa / perfil</span>
      <select id="f_faixa"><option value="">Todas</option>
      ${(window.__FAIXAS||[]).map(u=>`<option value="${esc(u)}" ${u===FILTRO.faixa?'selected':''}>${esc(u)}</option>`).join("")}
      </select></div>
    <div class="fld"><span>De</span><input type="date" id="f_de" value="${FILTRO.de||''}"></div>
    <div class="fld"><span>Até</span><input type="date" id="f_ate" value="${FILTRO.ate||''}"></div>
    <div class="fld"><span>Alerta</span>
      <select id="f_alerta">
        <option value="">Todos</option>
        <option value="1" ${FILTRO.alerta==="1"?'selected':''}>Somente com alerta</option>
        <option value="0" ${FILTRO.alerta==="0"?'selected':''}>Sem alerta</option>
      </select></div>
    <button class="btn ghost" id="f_limpar">Limpar</button>
    ${extra||''}
  </div>`;
}
function ligarFiltros(cb){
  const sync=()=>{
    FILTRO.form=$("#f_form").value; FILTRO.unidade=$("#f_unid").value;
    FILTRO.faixa=$("#f_faixa").value; FILTRO.de=$("#f_de").value;
    FILTRO.ate=$("#f_ate").value; FILTRO.alerta=$("#f_alerta").value;
    cb();
  };
  ["#f_form","#f_unid","#f_faixa","#f_de","#f_ate","#f_alerta"].forEach(s=>on(s,"change",sync));
  on("#f_limpar","click",()=>{FILTRO={form:"",unidade:"",faixa:"",de:"",ate:"",alerta:""};cb();});
}
function aplicaFiltro(lista){
  return lista.filter(e=>{
    if(FILTRO.form && String(e.formulario_id)!==String(FILTRO.form))return false;
    if(FILTRO.unidade && e.unidade_codigo!==FILTRO.unidade)return false;
    if(FILTRO.faixa && e.faixa_codigo!==FILTRO.faixa)return false;
    if(FILTRO.de && e.data_entrevista<FILTRO.de)return false;
    if(FILTRO.ate && e.data_entrevista>FILTRO.ate)return false;
    if(FILTRO.alerta==="1" && !e.alerta)return false;
    if(FILTRO.alerta==="0" && e.alerta)return false;
    return true;
  });
}
function popularListasFiltro(){
  window.__UNIDS=[...new Set(ENTS.map(e=>e.unidade_codigo).filter(Boolean))].sort(byPt());
  window.__FAIXAS=[...new Set(ENTS.map(e=>e.faixa_codigo).filter(Boolean))].sort(byPt());
}

async function renderPainel(){
  app.innerHTML=`<div class="card pad"><p class="lead">Carregando indicadores…</p></div>`;
  await carregarEntrevistas();
  popularListasFiltro();
  const {data:resp}=await sb.from("av_respostas")
    .select("entrevista_id,eixo_codigo,codigo,tipo,pergunta_cod,enunciado").limit(60000);
  window.__RESP=resp||[];
  pintarPainel();
}
function pintarPainel(){
  const ents=aplicaFiltro(ENTS);
  const ids=new Set(ents.map(e=>e.id));
  const rs=(window.__RESP||[]).filter(r=>ids.has(r.entrevista_id));
  const val=rs.filter(r=>r.codigo>=1&&r.codigo<=5);
  const nr=rs.filter(r=>r.codigo===0||r.codigo===9);
  const idx=val.length?val.reduce((s,r)=>s+r.codigo,0)/val.length:null;
  const alertas=ents.filter(e=>e.alerta).length;
  const tAlerta=ents.length?(alertas/ents.length*100):0;
  const tNR=rs.length?(nr.length/rs.length*100):0;

  app.innerHTML=`
  ${barraFiltros()}
  <div class="kpis">
    <div class="card kpi"><div class="n">${ents.length}</div><div class="l">Entrevistas</div>
      <div class="sub2">${[...new Set(ents.map(e=>e.unidade_codigo).filter(Boolean))].length} unidade(s)</div></div>
    <div class="card kpi g"><div class="n">${idx==null?'—':num(idx)}</div><div class="l">Índice geral de satisfação</div>
      <div class="sub2">${val.length} respostas fechadas</div></div>
    <div class="card kpi r"><div class="n">${num(tAlerta,1)}%</div><div class="l">Taxa de alerta</div>
      <div class="sub2">${alertas} entrevista(s)</div></div>
    <div class="card kpi y"><div class="n">${num(tNR,1)}%</div><div class="l">Taxa de não-resposta</div>
      <div class="sub2">recusa e não compreensão</div></div>
    <div class="card kpi b"><div class="n">${FORMS.filter(f=>f.status==='ativo').length}</div>
      <div class="l">Formulários ativos</div><div class="sub2">de ${FORMS.length} cadastrados</div></div>
  </div>
  ${alertas?`<div class="aviso r">${alertas} entrevista(s) acionaram o Protocolo de Alerta. Verifique a aba Respostas.</div>`:''}
  <div class="grid2">
    <div class="card pad"><h2 class="sec">Índice por eixo</h2>
      <p class="lead">Média das respostas fechadas em cada dimensão avaliada.</p>
      <div id="bx_eixo"></div></div>
    <div class="card pad"><h2 class="sec">Índice por unidade</h2>
      <p class="lead">Permite comparar o desempenho entre os locais de aplicação.</p>
      <div style="height:260px"><canvas id="c_unid"></canvas></div></div>
  </div>
  <div class="grid2" style="margin-top:18px">
    <div class="card pad"><h2 class="sec">Índice por faixa ou perfil</h2>
      <p class="lead">Indica também se o instrumento está adequado a cada público.</p>
      <div style="height:260px"><canvas id="c_faixa"></canvas></div></div>
    <div class="card pad"><h2 class="sec">Distribuição das respostas</h2>
      <p class="lead">Quantas respostas caíram em cada código da escala.</p>
      <div style="height:260px"><canvas id="c_dist"></canvas></div></div>
  </div>
  <div class="card pad" style="margin-top:18px">
    <h2 class="sec">Evolução entre períodos</h2>
    <p class="lead">Compara o índice geral de cada formulário ao longo do tempo. Cada ponto é uma edição da avaliação.</p>
    <div style="height:280px"><canvas id="c_evol"></canvas></div>
  </div>
  <div class="card pad" style="margin-top:18px">
    <h2 class="sec">Perguntas com pior avaliação</h2>
    <p class="lead">Ordenadas da menor para a maior média. São os pontos que mais pedem ação.</p>
    <div id="bx_perg"></div>
  </div>`;

  ligarFiltros(pintarPainel);
  if(!ents.length){
    $("#bx_eixo").innerHTML=$("#bx_perg").innerHTML=
      `<div class="empty"><svg width="56" height="56"><use href="#ico-vazio"></use></svg>
       <div>Nenhuma entrevista no recorte selecionado.</div></div>`;
    return;
  }

  // --- barras por eixo
  const porEixo={};
  val.filter(r=>r.eixo_codigo).forEach(r=>{(porEixo[r.eixo_codigo]=porEixo[r.eixo_codigo]||[]).push(r.codigo);});
  const linhas=Object.entries(porEixo)
    .map(([k,v])=>[k,v.reduce((a,b)=>a+b,0)/v.length,v.length])
    .sort((a,b)=>b[1]-a[1]);
  $("#bx_eixo").innerHTML=linhas.length?linhas.map(([k,m,n])=>{
    const pct=Math.max(4,((m-1)/2)*100);
    const cor=m>=2.5?'var(--verde)':m>=2?'var(--amarelo)':'var(--vermelho)';
    return `<div class="barrinha"><div class="lbl">${esc(k)} <span style="color:var(--muted)">(${n})</span></div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${cor}"></div></div>
      <div class="val">${num(m)}</div></div>`;}).join("")
    :`<div class="empty">Sem respostas fechadas classificadas por eixo.</div>`;

  // --- por unidade
  const pu={};ents.forEach(e=>{if(e.unidade_codigo)pu[e.unidade_codigo]=pu[e.unidade_codigo]||[];});
  rs.filter(r=>r.codigo>=1&&r.codigo<=5).forEach(r=>{
    const e=ents.find(x=>x.id===r.entrevista_id);
    if(e&&e.unidade_codigo)pu[e.unidade_codigo].push(r.codigo);});
  grafBarra("c_unid",Object.keys(pu),Object.values(pu).map(v=>v.length?(v.reduce((a,b)=>a+b,0)/v.length):0));

  // --- por faixa
  const pf={};ents.forEach(e=>{if(e.faixa_codigo)pf[e.faixa_codigo]=pf[e.faixa_codigo]||[];});
  rs.filter(r=>r.codigo>=1&&r.codigo<=5).forEach(r=>{
    const e=ents.find(x=>x.id===r.entrevista_id);
    if(e&&e.faixa_codigo)pf[e.faixa_codigo].push(r.codigo);});
  grafBarra("c_faixa",Object.keys(pf),Object.values(pf).map(v=>v.length?(v.reduce((a,b)=>a+b,0)/v.length):0));

  // --- distribuição
  const dist={};rs.forEach(r=>{if(r.codigo!=null)dist[r.codigo]=(dist[r.codigo]||0)+1;});
  const rotDist={0:'Recusa (0)',1:'Negativa (1)',2:'Intermediária (2)',3:'Positiva (3)',
                 4:'Alta (4)',5:'Muito alta (5)',9:'Não compreendeu (9)',99:'Alerta (99)'};
  const corDist={0:'#9aa4bd',1:'#E23B2E',2:'#EDA704',3:'#20BF40',4:'#12A5B4',5:'#0056EF',9:'#7A5CF0',99:'#8b1a10'};
  const kd=Object.keys(dist).sort((a,b)=>a-b);
  criarChart("c_dist",{type:'bar',
    data:{labels:kd.map(k=>rotDist[k]||k),datasets:[{data:kd.map(k=>dist[k]),
      backgroundColor:kd.map(k=>corDist[k]||'#0056EF'),borderRadius:6}]},
    options:{indexAxis:'y',plugins:{legend:{display:false}},
      scales:{x:{beginAtZero:true,ticks:{precision:0}}},maintainAspectRatio:false}});

  // --- evolução
  const grupos={};
  ents.forEach(e=>{
    const f=FORMS.find(x=>x.id===e.formulario_id);if(!f)return;
    const base=f.origem_id?(FORMS.find(x=>x.id===f.origem_id)||f):f;
    const serie=base.nome.replace(/ \(v\d+\)$/,'');
    const rotulo=`${f.data_inicio?dbr(f.data_inicio).slice(3):''} v${f.versao}`;
    grupos[serie]=grupos[serie]||{};
    (grupos[serie][rotulo]=grupos[serie][rotulo]||[]);
  });
  rs.filter(r=>r.codigo>=1&&r.codigo<=5).forEach(r=>{
    const e=ents.find(x=>x.id===r.entrevista_id);if(!e)return;
    const f=FORMS.find(x=>x.id===e.formulario_id);if(!f)return;
    const base=f.origem_id?(FORMS.find(x=>x.id===f.origem_id)||f):f;
    const serie=base.nome.replace(/ \(v\d+\)$/,'');
    const rotulo=`${f.data_inicio?dbr(f.data_inicio).slice(3):''} v${f.versao}`;
    if(grupos[serie]&&grupos[serie][rotulo])grupos[serie][rotulo].push(r.codigo);
  });
  const rotulos=[...new Set(Object.values(grupos).flatMap(g=>Object.keys(g)))].sort();
  const ds=Object.entries(grupos).map(([nome,g],i)=>({
    label:nome,borderColor:PAL[i%PAL.length],backgroundColor:PAL[i%PAL.length],
    tension:.3,spanGaps:true,pointRadius:5,
    data:rotulos.map(r=>{const v=g[r];return (v&&v.length)?+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):null;})
  }));
  criarChart("c_evol",{type:'line',data:{labels:rotulos,datasets:ds},
    options:{maintainAspectRatio:false,scales:{y:{suggestedMin:1,suggestedMax:3}},
      plugins:{legend:{position:'bottom'}}}});

  // --- piores perguntas
  const pp={};
  val.forEach(r=>{const k=r.pergunta_cod+"|"+(r.enunciado||"");(pp[k]=pp[k]||[]).push(r.codigo);});
  const piores=Object.entries(pp).map(([k,v])=>{
    const [cod,en]=k.split("|");
    return {cod,en,m:v.reduce((a,b)=>a+b,0)/v.length,n:v.length};
  }).filter(x=>x.n>=1).sort((a,b)=>a.m-b.m).slice(0,10);
  $("#bx_perg").innerHTML=piores.length?piores.map(p=>{
    const pct=Math.max(4,((p.m-1)/2)*100);
    const cor=p.m>=2.5?'var(--verde)':p.m>=2?'var(--amarelo)':'var(--vermelho)';
    return `<div class="barrinha"><div class="lbl" title="${esc(p.en)}">
      <b>${esc(p.cod)}</b> ${esc(p.en.length>58?p.en.slice(0,58)+'…':p.en)}</div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${cor}"></div></div>
      <div class="val">${num(p.m)}</div></div>`;}).join("")
    :`<div class="empty">Sem respostas fechadas no recorte.</div>`;
}
function criarChart(id,cfg){
  const el=document.getElementById(id);if(!el)return;
  CHARTS.push(new Chart(el.getContext('2d'),cfg));
}
function grafBarra(id,labels,dados){
  criarChart(id,{type:'bar',
    data:{labels,datasets:[{data:dados.map(d=>+Number(d).toFixed(2)),
      backgroundColor:dados.map(d=>d>=2.5?'#20BF40':d>=2?'#EDA704':'#E23B2E'),borderRadius:6}]},
    options:{plugins:{legend:{display:false}},maintainAspectRatio:false,
      scales:{y:{beginAtZero:true,suggestedMax:3}}}});
}

async function abrirPreparo(id){
  const D=await carregarFormCompleto(id);if(!D)return;
  const serv=(AUX.servidores||[]).map(s=>s.nome).sort(byPt());
  modal(`Preparar entrevista · ${esc(D.formulario.nome)}`,`
    <div class="aviso b">Confirme os termos antes de iniciar: consentimento do responsável legal
      (Anexo 4) e assentimento da criança ou adolescente (Anexo 5). Para funcionários, o Termo de
      Consentimento Livre e Esclarecido (Anexo 3). O ambiente deve estar reservado e sem terceiros.</div>
    <div class="frow">
      <div><label class="f">Unidade visitada</label>
        <select id="p_unid">${(D.unidades||[]).map(u=>
          `<option value="${esc(u.codigo)}">${esc(u.codigo)} — ${esc(u.nome)}</option>`).join("")}</select></div>
      <div><label class="f">Perfil / faixa etária</label>
        <select id="p_faixa">${(D.faixas||[]).map(x=>
          `<option value="${esc(x.codigo)}">${esc(x.nome)}</option>`).join("")}</select></div>
    </div>
    <div class="frow">
      <div><label class="f">Entrevistador(a) responsável</label>
        <select id="p_ent"><option value="">Selecione</option>
        ${serv.map(s=>`<option>${esc(s)}</option>`).join("")}</select></div>
      <div><label class="f">Data da entrevista</label>
        <input type="date" id="p_data" value="${hoje()}"></div>
    </div>
    <div id="p_orient" class="aviso y" style="display:none"></div>`,
    [{rot:"Cancelar",cls:"ghost",fn:fecharModal},
     {rot:"Iniciar entrevista",cls:"primary",fn:()=>{
        const ent=$("#p_ent").value;
        if(!ent){toast("Informe quem está aplicando a entrevista.");return;}
        iniciarEntrevista(D,$("#p_unid").value,$("#p_faixa").value,ent,$("#p_data").value);
     }}]);
  const mostra=()=>{
    const fx=(D.faixas||[]).find(x=>x.codigo===$("#p_faixa").value);
    const el=$("#p_orient");
    if(fx&&fx.orientacao){el.style.display="block";
      el.innerHTML=`<b>Orientação ao entrevistador</b><br>${esc(fx.orientacao)}
        ${fx.duracao_min?`<br>Duração estimada: ${fx.duracao_min} minutos.`:''}`;}
    else el.style.display="none";
  };
  on("#p_faixa","change",mostra);mostra();
}

async function iniciarEntrevista(D,unid,faixa,entrevistador,data){
  fecharModal();
  const un=(D.unidades||[]).find(u=>u.codigo===unid)||{};
  const fx=(D.faixas||[]).find(f=>f.codigo===faixa)||{};
  const perguntas=(D.perguntas||[])
    .filter(q=>!q.faixas||!q.faixas.length||q.faixas.includes(faixa))
    .sort((a,b)=>(a.ordem-b.ordem)||(a.id-b.id));
  if(!perguntas.length){toast("Este perfil não tem perguntas vinculadas.");return;}
  const codigo=await proximoCodigo('AVA');
  ENT={D,unid,un,faixa,fx,entrevistador,data,perguntas,codigo,
       i:0,respostas:{},hora_inicio:new Date().toTimeString().slice(0,5),etapa:"perguntas"};
  pintarEntrevista();
}

function blocoDe(q){return (ENT.D.blocos||[]).find(b=>b.id===q.bloco_id)||{};}
function eixoDe(q){
  const E=ENT.D.eixos||[];
  if(q.eixo_id){const e=E.find(x=>x.id===q.eixo_id);if(e)return e;}
  const b=blocoDe(q);return E.find(e=>e.id===b.eixo_id)||{};
}

function pintarEntrevista(){
  if(ENT.etapa==="fecho")return pintarFecho();
  const q=ENT.perguntas[ENT.i], b=blocoDe(q), e=eixoDe(q);
  const total=ENT.perguntas.length;
  const r=ENT.respostas[q.codigo]||{};
  const aberta=(q.tipo==="texto_longo"||q.tipo==="texto_curto");
  const modo=ENT.fx.modo_visual||"texto";

  entRoot.innerHTML=`<div class="ent-wrap">
    <div class="ent-top">
      <span class="id">${esc(ENT.codigo)}</span>
      <span class="ent-passo">${esc(ENT.un.codigo||'')} · ${esc(ENT.fx.nome||'')}</span>
      <div class="ent-prog"><i style="width:${(ENT.i/total*100).toFixed(1)}%"></i></div>
      <span class="ent-passo">${ENT.i+1} de ${total}</span>
      <button class="btn danger sm" id="e_sair">Interromper</button>
    </div>
    <div class="ent-body"><div class="ent-inner">
      <div class="ent-bloco">
        ${e.icone?ico(e.icone,"eixo-ico lg",e.cor||'#0056EF'):''}
        <div><h3>${esc(b.titulo||'')}</h3>
          ${e.nome?`<div style="font-size:12.5px;color:var(--muted)">${esc(e.codigo)} · ${esc(e.nome)}</div>`:''}</div>
      </div>
      <div class="ent-perg">${esc(q.enunciado)}</div>
      ${q.orientacao?`<div class="ent-orient"><b>Orientação</b> — ${esc(q.orientacao)}</div>`:''}
      ${aberta?`<div class="ent-aberta">
          <textarea id="e_txt" maxlength="5000" placeholder="Transcreva a fala textualmente, entre aspas. Não interprete nem parafraseie.">${esc(r.texto||'')}</textarea>
          <div style="font-size:12px;color:var(--muted);margin-top:6px" id="e_cont"></div>
        </div>`
       :`<div class="ent-opts">${opcoesHtml(q,modo,r)}</div>`}
      <div class="ent-esp">
        <button class="esp ${r.codigo===0?'on':''}" data-esp="0">Não quis responder <b>(0)</b></button>
        <button class="esp ${r.codigo===9?'on':''}" data-esp="9">Não compreendeu <b>(9)</b></button>
        <button class="esp alerta ${r.alerta?'on':''}" data-esp="99">Situação de alerta <b>(99)</b></button>
      </div>
      ${q.critica?`<div class="aviso y" style="margin-top:18px">Pergunta crítica: resposta negativa
        aciona o Protocolo de Alerta automaticamente.</div>`:''}
    </div></div>
    <div class="ent-foot">
      <button class="btn ghost" id="e_ant" ${ENT.i===0?'disabled':''}>Voltar</button>
      <span class="ent-passo">${q.obrigatoria?'Resposta obrigatória':'Resposta opcional'}</span>
      <button class="btn primary" id="e_prox">${ENT.i===total-1?'Concluir perguntas':'Avançar'}</button>
    </div>
  </div>`;

  $$("[data-opt]").forEach(btn=>btn.onclick=()=>{
    const cod=+btn.dataset.opt;
    ENT.respostas[q.codigo]={codigo:cod,rotulo:btn.dataset.rot,
      alerta:(q.critica&&cod===1)||((ENT.respostas[q.codigo]||{}).alerta===true)};
    pintarEntrevista();
    if(q.tipo!=="multipla")setTimeout(()=>{if(ENT.i<total-1)avancar();},260);
  });
  $$("[data-esp]").forEach(btn=>btn.onclick=()=>{
    const v=+btn.dataset.esp;
    const at=ENT.respostas[q.codigo]||{};
    if(v===99){
      if(at.alerta){at.alerta=false;}
      else{at.alerta=true;
        const d=prompt("Descreva de forma objetiva e factual o que motivou o alerta.\nPreserve as falas textuais entre aspas.",ENT.alerta_desc||"");
        if(d!==null)ENT.alerta_desc=((ENT.alerta_desc?ENT.alerta_desc+"\n\n":"")+`[${q.codigo}] ${d}`);
      }
      ENT.respostas[q.codigo]=at;
    }else{
      ENT.respostas[q.codigo]={codigo:(at.codigo===v?null:v),rotulo:(v===0?'Não quis responder':'Não compreendeu'),alerta:at.alerta||false};
    }
    pintarEntrevista();
  });
  const ta=$("#e_txt");
  if(ta){
    const cont=()=>{$("#e_cont").textContent=`${ta.value.length} de 5.000 caracteres`;};
    ta.oninput=()=>{ENT.respostas[q.codigo]={texto:ta.value,alerta:(ENT.respostas[q.codigo]||{}).alerta||false};cont();};
    cont();ta.focus();
  }
  on("#e_ant","click",()=>{if(ENT.i>0){ENT.i--;pintarEntrevista();}});
  on("#e_prox","click",avancar);
  on("#e_sair","click",()=>{
    if(confirm("Interromper a entrevista?\n\nOs dados já coletados podem ser salvos — o motivo da interrupção deve ser registrado nas observações."))
      {ENT.etapa="fecho";ENT.interrompida=true;pintarEntrevista();}
  });

  function avancar(){
    const at=ENT.respostas[q.codigo]||{};
    const vazio=aberta?!(at.texto||"").trim():(at.codigo==null);
    if(q.obrigatoria&&vazio&&!at.alerta){toast("Esta pergunta é obrigatória. Se não houver resposta, marque 0 ou 9.");return;}
    if(ENT.i<total-1){ENT.i++;pintarEntrevista();}
    else{ENT.etapa="fecho";pintarEntrevista();}
  }
}

function opcoesHtml(q,modo,r){
  let ops=q.opcoes||[];
  if(!ops.length){
    if(q.tipo==="escala3")ops=[{rotulo:"Sim",codigo:3},{rotulo:"Mais ou menos",codigo:2},{rotulo:"Não",codigo:1}];
    else if(q.tipo==="binaria")ops=[{rotulo:"Sim",codigo:3},{rotulo:"Não",codigo:1}];
    else if(q.tipo==="escala5")ops=[5,4,3,2,1].map(n=>({rotulo:String(n),codigo:n}));
  }
  if(q.tipo==="data")return `<input type="date" id="e_dt" style="font-size:20px;padding:16px">`;
  if(q.tipo==="hora")return `<input type="time" id="e_hr" style="font-size:20px;padding:16px">`;

  const ordem=[...ops].sort((a,b)=>(b.codigo||0)-(a.codigo||0));
  return ordem.map(o=>{
    const on=r.codigo===o.codigo?'on':'';
    let visual='';
    if(modo==="rostos"&&o.codigo>=1&&o.codigo<=3){
      const s=o.codigo===3?'feliz':o.codigo===2?'neutro':'triste';
      visual=`<svg viewBox="0 0 120 130"><use href="#ico-${s}"></use></svg>`;
    }else if(modo==="barras"&&o.codigo>=1&&o.codigo<=3){
      visual=`<svg viewBox="0 0 120 70"><use href="#bar-${o.codigo}"></use></svg>`;
    }
    const cls=modo==="barras"?"opt barra":(visual?"opt":"opt txt");
    return `<button type="button" class="${cls} ${on}" data-opt="${o.codigo}" data-rot="${esc(o.rotulo)}">
      ${visual}<span class="rot">${esc(o.rotulo)}</span></button>`;
  }).join("");
}

function pintarFecho(){
  const sinais=["hesitação prolongada","choro","mudança brusca de postura",
    "medo ao responder","relato interrompido","silêncio prolongado","outro"];
  const temAlerta=Object.values(ENT.respostas).some(r=>r.alerta)||!!ENT.alerta_desc;
  entRoot.innerHTML=`<div class="ent-wrap">
    <div class="ent-top">
      <span class="id">${esc(ENT.codigo)}</span>
      <span class="ent-passo">Observações do(a) entrevistador(a)</span>
      <div class="ent-prog"><i style="width:100%"></i></div>
    </div>
    <div class="ent-body"><div class="ent-inner">
      ${ENT.interrompida?`<div class="aviso y">Entrevista interrompida. Os dados já coletados
        permanecem válidos — registre o motivo da interrupção nas observações gerais.</div>`:''}

async function salvarEntrevista(){
  const btn=$("#o_salvar");btn.disabled=true;btn.textContent="Salvando…";
  const alerta=$("#o_alerta").checked;
  const cab={
    codigo:ENT.codigo, formulario_id:ENT.D.formulario.id, formulario_versao:ENT.D.formulario.versao,
    unidade_codigo:ENT.unid, unidade_nome:ENT.un.nome||null,
    faixa_codigo:ENT.faixa, faixa_nome:ENT.fx.nome||null,
    entrevistador:ENT.entrevistador, data_entrevista:ENT.data,
    hora_inicio:ENT.hora_inicio, hora_fim:$("#o_fim").value||null,
    interrupcoes:$("#o_int").value==="1", terceiros:$("#o_ter").value==="1",
    interrupcoes_desc:$("#o_desc").value.trim()||null,
    compreensao:$("#o_comp").value,
    sinais_nao_verbais:$$(".o_sin").filter(c=>c.checked).map(c=>c.value),
    adaptacao_linguagem:$("#o_adap").value.trim()||null,
    observacoes:($("#o_obs").value.trim()+(ENT.interrompida?"\n\n[Entrevista interrompida]":"")).trim()||null,
    alerta, alerta_desc:alerta?($("#o_alerta_desc").value.trim()||null):null,
    alerta_origem:alerta?'manual':null, status:'concluida'
  };
  const resps=ENT.perguntas.map(q=>{
    const r=ENT.respostas[q.codigo]||{};
    const b=blocoDe(q), e=eixoDe(q);
    return {pergunta_id:q.id, pergunta_cod:q.codigo, enunciado:q.enunciado,
      eixo_codigo:e.codigo||null, bloco_titulo:b.titulo||null, tipo:q.tipo,
      codigo:(r.alerta&&r.codigo==null)?99:(r.codigo??null),
      rotulo:r.rotulo||null, texto:r.texto||null, alerta:!!r.alerta};
  });
  const ok=await gravarEntrevista(cab,resps,false);
  entRoot.innerHTML="";ENT=null;
  if(ok)toast("Entrevista registrada.");
  else{atualizarFila();toast("Sem conexão: a entrevista ficou guardada no aparelho e será enviada depois.");}
  ir("aplicar");
}

function itemEnc(e){

async function gerarEncaminhamento(){
  const lista=aplicaFiltro(ENTS).filter(e=>!e.encaminhamento_id);
  if(!lista.length){toast("Nenhuma entrevista sem encaminhamento no recorte atual.");return;}
  const f=FORMS.find(x=>x.id===lista[0].formulario_id)||{};
  if(new Set(lista.map(e=>e.formulario_id)).size>1){
    toast("Selecione um único formulário no filtro antes de gerar.");return;}
  const ids=lista.map(e=>e.id);
  const {data:rs}=await sb.from("av_respostas").select("entrevista_id,codigo").in("entrevista_id",ids);
  const val=(rs||[]).filter(r=>r.codigo>=1&&r.codigo<=5);
  const idx=val.length?+(val.reduce((s,r)=>s+r.codigo,0)/val.length).toFixed(2):null;
  const alertas=lista.filter(e=>e.alerta).length;
  const unid=[...new Set(lista.map(e=>e.unidade_codigo).filter(Boolean))];
  const codigo=await proximoCodigo('ENC');

  const rec={
    codigo, formulario_id:f.id, formulario_nome:f.nome,
    unidade_codigo:unid.length===1?unid[0]:null,
    periodo_ini:lista.map(e=>e.data_entrevista).sort()[0],
    periodo_fim:lista.map(e=>e.data_entrevista).sort().slice(-1)[0],
    entrevistas_ids:ids, qtd_entrevistas:ids.length, qtd_alertas:alertas,
    indice_geral:idx,
    resumo:montarResumo(f,lista,idx,alertas,unid),
    tipo_demanda:'Avaliação de Serviço Público',
    area:f.ogm_area, subarea:f.ogm_subarea, ods:f.ogm_ods||[],
    ods_metas:f.ogm_ods_metas||[], orgao:f.ogm_orgao, eixo:f.ogm_eixo,
    status:'pendente'
  };
  const {data,error}=await sb.from("av_encaminhamentos").insert(rec).select("id").single();
  if(error){toast("Erro ao gerar: "+error.message);return;}
  await sb.from("av_entrevistas").update({encaminhamento_id:data.id}).in("id",ids);
  toast("Encaminhamento gerado. Revise antes de enviar ao OGM.");
  await renderEncaminhamentos();
  revisarEncaminhamento(data.id);
}
function montarResumo(f,lista,idx,alertas,unid){
  const porFaixa={};lista.forEach(e=>{porFaixa[e.faixa_nome||e.faixa_codigo]=(porFaixa[e.faixa_nome||e.faixa_codigo]||0)+1;});
  return `AVALIAÇÃO DE SERVIÇO PÚBLICO — ${f.nome}
Serviço avaliado: ${f.servico||'—'}
Período de coleta: ${dbr(lista.map(e=>e.data_entrevista).sort()[0])} a ${dbr(lista.map(e=>e.data_entrevista).sort().slice(-1)[0])}
Unidade(s): ${unid.join(', ')||'—'}
Entrevistas realizadas: ${lista.length}
${Object.entries(porFaixa).map(([k,v])=>`  · ${k}: ${v}`).join("\n")}
Índice geral de satisfação: ${idx==null?'—':num(idx)} (escala 1 a 3)
Entrevistas com Protocolo de Alerta acionado: ${alertas}

Fundamento: Lei nº 13.460/2017, art. 7º; Guia de Avaliação de Serviços Públicos (CGU).
Códigos das entrevistas: ${lista.map(e=>e.codigo).join(', ')}
Os dados detalhados, anonimizados, constam do Sistema de Avaliação de Serviços Públicos da Ouvidoria-Geral.`;
}

    </fieldset>`,
    enviado?[{rot:"Fechar",cls:"ghost",fn:fecharModal}]
    :[{rot:"Fechar",cls:"ghost",fn:fecharModal},
      {rot:"Arquivar sem encaminhar",cls:"danger",fn:()=>arquivarEnc(e.id)},
      {rot:"Salvar revisão",cls:"ghost",fn:()=>salvarRevisao(e.id,false)},
      {rot:"Criar processo no OGM",cls:"ok",fn:()=>salvarRevisao(e.id,true)}],
    "wide");

  // subárea dependente

    orgao:$("#v_org").value||null, servidor:$("#v_serv").value||null,

async function salvarRevisao(id,enviar){
  const d=coletaRevisao();
  if(enviar){
    if(!d.numero_sei){toast("Informe o número SEI do processo antes de criar.");return;}
    if(!d.area||!d.subarea){toast("Classifique área e subárea antes de criar o processo.");return;}
  }
  const upd={...d,status:enviar?'aprovado':'pendente',
    revisado_por:d.servidor,revisado_em:new Date().toISOString()};
  const {error}=await sb.from("av_encaminhamentos").update(upd).eq("id",id);
  if(error){toast("Erro ao salvar: "+error.message);return;}
  if(!enviar){toast("Revisão salva.");fecharModal();return renderEncaminhamentos();}
  await criarProcessoOGM(id,d);
}
async function criarProcessoOGM(id,d){
  const e=ENCS.find(x=>x.id===id)||{};
  const rec={
    numero_sei:d.numero_sei, data_entrada:hoje(),
    tipo_demanda:'Avaliação de Serviço Público',
    orgao_demandado:d.orgao||null, orgaos:d.orgao?[d.orgao]:[],
    n_manifestacoes:1,
    area:d.area, subarea:d.subarea, ods:(d.ods||[]).map(Number),
    servidor:d.servidor||null, unidade_resp:d.unidade_resp||'CG-OGM',
    status:'Em análise',
    observacoes:d.resumo
  };
  const {data,error}=await sbo.from("processos").insert(rec).select("id").single();
  if(error){
    // tenta sem os campos que podem não existir na tabela
    const min={numero_sei:rec.numero_sei,data_entrada:rec.data_entrada,tipo_demanda:rec.tipo_demanda,
      orgao_demandado:rec.orgao_demandado,orgaos:rec.orgaos,n_manifestacoes:1,
      area:rec.area,subarea:rec.subarea,ods:rec.ods,servidor:rec.servidor,
      unidade_resp:rec.unidade_resp,status:rec.status};
    const r2=await sbo.from("processos").insert(min).select("id").single();
    if(r2.error){toast("Não foi possível criar o processo: "+r2.error.message);return;}
    await sb.from("av_encaminhamentos").update({status:'enviado',ogm_processo_id:r2.data.id}).eq("id",id);
  }else{
    await sb.from("av_encaminhamentos").update({status:'enviado',ogm_processo_id:data.id}).eq("id",id);
  }
  toast(`Processo ${d.numero_sei} criado no OGM.`);
  fecharModal();renderEncaminhamentos();
}
async function arquivarEnc(id){
  const m=prompt("Motivo para arquivar sem encaminhar ao OGM:");
  if(m===null)return;
  const {error}=await sb.from("av_encaminhamentos")
    .update({status:'rejeitado',motivo_rejeicao:m,revisado_em:new Date().toISOString()}).eq("id",id);
  if(error){toast("Erro: "+error.message);return;}

function renderGestao(){
  if(GESTAO.form)return renderEditor();
  const por={};
  FORMS.forEach(f=>{(por[f.status]=por[f.status]||[]).push(f);});
  const ordem=['ativo','publicado','rascunho','encerrado','descartado'];
  app.innerHTML=`<div class="card pad">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div><h2 class="sec">Formulários de avaliação</h2>
        <p class="lead">Cada formulário é uma edição de uma avaliação: um serviço, um período,
          uma versão. Reutilizar significa clonar e revisar os quesitos — as respostas antigas
          permanecem presas à versão em que foram coletadas.</p></div>
      <button class="btn primary" id="g_novo">Novo formulário</button>
    </div>
    ${ordem.filter(s=>por[s]&&por[s].length).map(s=>`
      <h3 style="font-size:13px;margin:20px 0 10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)">
        ${STATUS_FORM[s].rot}</h3>
      ${por[s].map(f=>linhaGestao(f)).join("")}`).join("")}
    ${!FORMS.length?`<div class="empty"><svg width="56" height="56"><use href="#ico-vazio"></use></svg>
      <div>Nenhum formulário cadastrado.</div></div>`:''}
  </div>`;
  on("#g_novo","click",novoFormulario);
  $$("[data-ed]").forEach(b=>b.onclick=()=>abrirEditor(+b.dataset.ed));
  $$("[data-clone]").forEach(b=>b.onclick=()=>clonar(+b.dataset.clone));
  $$("[data-st]").forEach(b=>b.onclick=()=>mudarStatus(+b.dataset.st,b.dataset.para));
}
function linhaGestao(f){
  const st=STATUS_FORM[f.status];
  const acts=[];
  if(f.status==='rascunho'){
    acts.push(`<button class="btn ghost sm" data-ed="${f.id}">Editar</button>`);
    acts.push(`<button class="btn primary sm" data-st="${f.id}" data-para="publicado">Publicar</button>`);
    acts.push(`<button class="btn danger sm" data-st="${f.id}" data-para="descartado">Descartar</button>`);
  }else if(f.status==='publicado'){
    acts.push(`<button class="btn ghost sm" data-ed="${f.id}">Ver / editar</button>`);
    acts.push(`<button class="btn ok sm" data-st="${f.id}" data-para="ativo">Ativar coleta</button>`);
    acts.push(`<button class="btn ghost sm" data-st="${f.id}" data-para="rascunho">Voltar a rascunho</button>`);
  }else if(f.status==='ativo'){
    acts.push(`<button class="btn ghost sm" data-ed="${f.id}">Ver</button>`);
    acts.push(`<button class="btn primary sm" data-st="${f.id}" data-para="encerrado">Encerrar período</button>`);
  }else if(f.status==='encerrado'){
    acts.push(`<button class="btn ghost sm" data-ed="${f.id}">Ver</button>`);
  }
  if(f.status!=='descartado')
    acts.push(`<button class="btn ghost sm" data-clone="${f.id}">Clonar nova versão</button>`);
  return `<div class="lista-item">
    <div class="mt"><b>${esc(f.nome)}</b>
      <div class="m2">${esc(f.servico||'—')}</div>
      <div class="m2">${esc(f.codigo)} · versão ${f.versao}
        ${f.origem_id?' · derivado de versão anterior':''}
        ${f.data_inicio?` · ${dbr(f.data_inicio)} a ${dbr(f.data_fim)}`:''}</div></div>
    <span class="chip ${st.chip}">${st.rot}</span>
    <div class="acts">${acts.join("")}</div></div>`;
}
async function mudarStatus(id,para){
  const f=FORMS.find(x=>x.id===id);
  if(para==='ativo'&&(!f.data_inicio||!f.data_fim)){
    toast("Defina o período de coleta antes de ativar.");return abrirEditor(id);}
  if(para==='descartado'&&!confirm("Descartar este formulário? Ele deixa de aparecer nas listas, mas fica no histórico."))return;
  if(para==='encerrado'&&!confirm("Encerrar o período de coleta?\n\nAs entrevistas registradas ficam congeladas e continuam visíveis no painel."))return;
  const {error}=await sb.from("av_formularios").update({status:para}).eq("id",id);
  if(error){toast(error.message);return;}
  await carregarFormularios();renderGestao();
  toast(`Formulário ${STATUS_FORM[para].rot.toLowerCase()}.`);
}
async function clonar(id){
  const f=FORMS.find(x=>x.id===id);
  const nome=prompt("Nome da nova versão:",f.nome.replace(/ \(v\d+\)$/,'')+" — nova edição");
  if(nome===null)return;
  const {data,error}=await sb.rpc('av_clonar_formulario',{p_id:id,p_nome:nome});
  if(error){toast("Erro ao clonar: "+error.message);return;}
  await carregarFormularios();
  toast("Nova versão criada em rascunho. Revise os quesitos antes de publicar.");
  abrirEditor(data);
}
async function novoFormulario(){
  const nome=prompt("Nome do formulário:\n\nEx.: Atendimento nas UBS — 2º semestre de 2026");
  if(!nome)return;
  const codigo=await proximoCodigo('FORM');
  const {data,error}=await sb.from("av_formularios")
    .insert({codigo,nome,status:'rascunho',criado_por:'Ouvidoria-Geral'}).select("id").single();
  if(error){toast(error.message);return;}
  await carregarFormularios();abrirEditor(data.id);
}

function edPerguntas(ro){

  // as perguntas antigas são apagadas em cascata junto com os blocos
}
function opcoesDe(q){
  if(q.opcoes&&q.opcoes.length)return q.opcoes;
  if(q.tipo==="escala3")return [{rotulo:"Sim",codigo:3},{rotulo:"Mais ou menos",codigo:2},{rotulo:"Não",codigo:1}];
  if(q.tipo==="binaria")return [{rotulo:"Sim",codigo:3},{rotulo:"Não",codigo:1}];
  if(q.tipo==="escala5")return [5,4,3,2,1].map(n=>({rotulo:String(n),codigo:n}));
  return [];
}

      <div><label class="f">Tipo de resposta</label>

      <select data-q="eixo_id" data-i="${i}" ${dis(ro)}>

      ${ro?'':`<button class="btn ghost sm" data-opcs="${i}">Editar opções</button>`}</div>`}

        ${esc(f.codigo)}</label>`).join("")}</div>`:''}

function editarOpcoes(i,cb){
  const q=GESTAO.form.perguntas[i];
  const ops=opcoesDe(q).slice();
  modal("Opções de resposta",`
    <p class="lead">Códigos mais altos representam percepção mais positiva. Isso permite comparar
      médias entre perguntas com escalas diferentes. Em perguntas invertidas — "você sente
      sobrecarga?" — atribua 3 à resposta mais favorável ao serviço.</p>
    <div id="lo"></div>
    <button class="btn ghost sm" id="o_add">Adicionar opção</button>`,
    [{rot:"Cancelar",cls:"ghost",fn:fecharModal},
     {rot:"Aplicar",cls:"primary",fn:()=>{
        q.opcoes=ops.filter(o=>(o.rotulo||'').trim()&&o.codigo!=null)
          .map(o=>({rotulo:o.rotulo.trim(),codigo:+o.codigo}));
        fecharModal();cb();}}]);
  const pinta=()=>{
    $("#lo").innerHTML=ops.map((o,j)=>`
      <div class="linha-edit" style="grid-template-columns:1fr 110px 40px">
        <input value="${esc(o.rotulo)}" data-o="rotulo" data-j="${j}" placeholder="Sempre">
        <input type="number" value="${o.codigo}" data-o="codigo" data-j="${j}" min="1" max="5">
        <button class="rm" data-rmo="${j}">×</button></div>`).join("");
    $$("[data-o]").forEach(el=>el.onchange=()=>{
      ops[+el.dataset.j][el.dataset.o]=el.dataset.o==="codigo"?+el.value:el.value;});
    $$("[data-rmo]").forEach(b=>b.onclick=()=>{ops.splice(+b.dataset.rmo,1);pinta();});
  };
  pinta();
  on("#o_add","click",()=>{ops.push({rotulo:"",codigo:ops.length?Math.min(5,ops.length+1):1});pinta();});

async function importarPerguntas(cb){
  const outros=FORMS.filter(f=>f.id!==GESTAO.form.formulario.id);
  if(!outros.length){toast("Não há outro formulário para copiar.");return;}
  modal("Importar perguntas","<div><label class='f'>Formulário de origem</label>"+
    `<select id="imp_f">${outros.map(f=>`<option value="${f.id}">${esc(f.nome)} · v${f.versao}</option>`).join("")}</select>`+
    `<p class="lead" style="margin-top:12px">Os blocos e perguntas do formulário escolhido serão
      acrescentados ao final deste. Os eixos são associados pelo código, quando existirem aqui.</p></div>`,
    [{rot:"Cancelar",cls:"ghost",fn:fecharModal},
     {rot:"Importar",cls:"primary",fn:async()=>{
        const O=await carregarFormCompleto(+$("#imp_f").value);if(!O)return;
        const D=GESTAO.form;
        const mapa={};
        (O.blocos||[]).forEach(b=>{
          const eixoO=(O.eixos||[]).find(x=>x.id===b.eixo_id)||{};
          const eixoD=(D.eixos||[]).find(x=>x.codigo===eixoO.codigo);
          const novo={id:-(Date.now()+Math.random()*1000|0),titulo:b.titulo,
            eixo_id:eixoD?eixoD.id:null,ordem:D.blocos.length+1};
          D.blocos.push(novo);mapa[b.id]=novo.id;
        });
        (O.perguntas||[]).forEach(q=>{
          const exO=(O.eixos||[]).find(x=>x.id===q.eixo_id);
          const exD=exO?(D.eixos||[]).find(x=>x.codigo===exO.codigo):null;
          D.perguntas.push({...q,id:undefined,bloco_id:mapa[q.bloco_id]??null,
            eixo_id:exD?exD.id:null,
            codigo:(D.perguntas.some(x=>x.codigo===q.codigo)?q.codigo+"_i":q.codigo),
            ordem:D.perguntas.length+1});
        });
        fecharModal();cb();toast("Perguntas importadas. Revise antes de salvar.");
     }}]);
}

function descricaoFiltros(){
  const p=[];
  const f=FORMS.find(x=>String(x.id)===String(FILTRO.form));
  p.push(["Formulário",f?`${f.nome} (versão ${f.versao})`:"Todos"]);
  p.push(["Serviço avaliado",f?(f.servico||"—"):"—"]);
  p.push(["Unidade",FILTRO.unidade||"Todas"]);
  p.push(["Faixa ou perfil",FILTRO.faixa||"Todos"]);
  p.push(["Período",(FILTRO.de||FILTRO.ate)?`${FILTRO.de?dbr(FILTRO.de):'início'} a ${FILTRO.ate?dbr(FILTRO.ate):'hoje'}`
    :(f&&f.data_inicio?`${dbr(f.data_inicio)} a ${dbr(f.data_fim)}`:"Todo o histórico")]);
  p.push(["Recorte de alerta",FILTRO.alerta==="1"?"Somente entrevistas com alerta":
    FILTRO.alerta==="0"?"Somente entrevistas sem alerta":"Todas as entrevistas"]);
  return p;
}

async function gerarPDF(lista){
  const btn=$("#rel_pdf");btn.disabled=true;btn.textContent="Montando relatório…";
  const ids=lista.map(e=>e.id);
  const {data:rs}=await sb.from("av_respostas").select("*").in("entrevista_id",ids).limit(60000);
  const R=rs||[];

  <p class="fonte">Ordenado da menor para a maior média. As linhas do topo indicam os pontos que

async function exportarXlsx(lista){
  if(!lista.length){toast("Nada a exportar no recorte.");return;}
  toast("Montando a planilha…");
  const ids=lista.map(e=>e.id);
  const {data:rs}=await sb.from("av_respostas").select("*").in("entrevista_id",ids).limit(60000);
  const R=rs||[];
  const cods=[...new Set(R.map(r=>r.pergunta_cod))].sort();
  const enun={};R.forEach(r=>{enun[r.pergunta_cod]=r.enunciado;});
  const linhas=lista.map(e=>{
    const meus=R.filter(r=>r.entrevista_id===e.id);
    const val=meus.filter(r=>r.codigo>=1&&r.codigo<=5);
    const l={
      "Código da entrevista":e.codigo,
      "Formulário":(FORMS.find(f=>f.id===e.formulario_id)||{}).nome||"",
      "Versão":e.formulario_versao,
      "Unidade":e.unidade_codigo||"", "Unidade (nome)":e.unidade_nome||"",
      "Perfil":e.faixa_codigo||"", "Perfil (nome)":e.faixa_nome||"",
      "Data":dbr(e.data_entrevista),
      "Hora início":(e.hora_inicio||"").slice(0,5), "Hora fim":(e.hora_fim||"").slice(0,5),
      "Entrevistador(a)":e.entrevistador||"",
      "Índice da entrevista":val.length?+(val.reduce((s,r)=>s+r.codigo,0)/val.length).toFixed(2):"",
      "Alerta":e.alerta?"SIM":"não", "Descrição do alerta":e.alerta_desc||"",
      "Interrupções":e.interrupcoes?"sim":"não", "Terceiros presentes":e.terceiros?"sim":"não",
      "Compreensão":e.compreensao||"",
      "Sinais não verbais":(e.sinais_nao_verbais||[]).join("; "),
      "Adaptação de linguagem":e.adaptacao_linguagem||"",
      "Observações gerais":e.observacoes||""
    };
    cods.forEach(c=>{
      const r=meus.find(x=>x.pergunta_cod===c);
      l[c]=r?(r.texto?r.texto:(r.codigo??"")):"";
    });
    return l;
  });
  // linha 1: dicionário dos enunciados
  const dic={"Código da entrevista":"— enunciado das perguntas —"};
  cods.forEach(c=>{dic[c]=enun[c]||"";});
  const ws=XLSX.utils.json_to_sheet([dic,...linhas]);
  ws['!cols']=Object.keys(linhas[0]||dic).map(k=>({wch:Math.min(46,Math.max(12,k.length+4))}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Avaliações");
  const f=FORMS.find(x=>String(x.id)===String(FILTRO.form));
  const nome=`avaliacao_${(f?f.nome:'geral').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_').toLowerCase()}_${hoje()}.xlsx`;
  XLSX.writeFile(wb,nome);
  toast("Planilha baixada.");
}

function modal(titulo,corpo,botoes,classe){
  modalRoot.innerHTML=`<div class="overlay"><div class="modal ${classe||''}">
    <div class="modal-head"><h3>${titulo}</h3><button class="x" id="m_x">×</button></div>
    <div class="modal-body">${corpo}</div>
    <div class="modal-foot">${(botoes||[]).map((b,i)=>
      `<button class="btn ${b.cls||'ghost'}" data-mb="${i}">${esc(b.rot)}</button>`).join("")}</div>
  </div></div>`;
  on("#m_x","click",fecharModal);
  $$("[data-mb]").forEach(b=>b.onclick=()=>botoes[+b.dataset.mb].fn());
  modalRoot.querySelector(".overlay").onclick=ev=>{if(ev.target.classList.contains("overlay"))fecharModal();};
}
function fecharModal(){modalRoot.innerHTML="";}
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!ENT)fecharModal();});
